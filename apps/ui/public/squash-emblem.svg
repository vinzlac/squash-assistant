<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" color="#c1440e">
  <defs>
    <clipPath id="rhead1">
      <ellipse cx="150" cy="80" rx="36" ry="50" transform="rotate(-25 150 150)" />
    </clipPath>
    <clipPath id="rhead2">
      <ellipse cx="150" cy="80" rx="36" ry="50" transform="rotate(25 150 150) scale(-1 1) translate(-300 0)" />
    </clipPath>
  </defs>

  <!-- Raquette 1 (inclinée à gauche) -->
  <g stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-25 150 150)">
    <g clip-path="url(#rhead1)" stroke-width="2">
      <line x1="114" y1="46" x2="114" y2="114" />
      <line x1="126" y1="32" x2="126" y2="128" />
      <line x1="138" y1="26" x2="138" y2="134" />
      <line x1="150" y1="24" x2="150" y2="136" />
      <line x1="162" y1="26" x2="162" y2="134" />
      <line x1="174" y1="32" x2="174" y2="128" />
      <line x1="186" y1="46" x2="186" y2="114" />
      <line x1="112" y1="60" x2="188" y2="60" />
      <line x1="108" y1="80" x2="192" y2="80" />
      <line x1="112" y1="100" x2="188" y2="100" />
    </g>
    <ellipse cx="150" cy="80" rx="36" ry="50" />
    <line x1="150" y1="130" x2="150" y2="158" />
    <rect x="143" y="158" width="14" height="62" rx="7" fill="currentColor" stroke="none" />
  </g>

  <!-- Raquette 2 (inclinée à droite, miroir) -->
  <g stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(25 150 150)">
    <g clip-path="url(#rhead2)" stroke-width="2">
      <line x1="114" y1="46" x2="114" y2="114" />
      <line x1="126" y1="32" x2="126" y2="128" />
      <line x1="138" y1="26" x2="138" y2="134" />
      <line x1="150" y1="24" x2="150" y2="136" />
      <line x1="162" y1="26" x2="162" y2="134" />
      <line x1="174" y1="32" x2="174" y2="128" />
      <line x1="186" y1="46" x2="186" y2="114" />
      <line x1="112" y1="60" x2="188" y2="60" />
      <line x1="108" y1="80" x2="192" y2="80" />
      <line x1="112" y1="100" x2="188" y2="100" />
    </g>
    <ellipse cx="150" cy="80" rx="36" ry="50" />
    <line x1="150" y1="130" x2="150" y2="158" />
    <rect x="143" y="158" width="14" height="62" rx="7" fill="currentColor" stroke="none" />
  </g>

  <!-- Balle -->
  <circle cx="150" cy="150" r="13" fill="currentColor" />
</svg>
