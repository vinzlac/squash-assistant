# UI d'admin (Phase 4) — LAN-only, pas d'auth applicative (mono-utilisateur).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squash-assistant-ui
  namespace: squash-assistant
  labels:
    app.kubernetes.io/name: squash-assistant-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: squash-assistant-ui
  template:
    metadata:
      labels:
        app: squash-assistant-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ui
          image: ghcr.io/vinzlac/squash-assistant-ui:3a1f3f05e33b52849e834e60fbc88f394a012344
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HUDDLE_BOT_MCP_URL
              value: "https://huddle-bot.code-advisors.site/api/mcp"
            - name: RESA_SQUASH_MCP_URL
              value: "https://resa-squash.vercel.app/api/mcp"
            - name: WORKER_INTERNAL_URL
              value: "http://squash-assistant.squash-assistant.svc.cluster.local:8080"
          envFrom:
            - secretRef:
                name: squash-assistant-huddle-bot
            - secretRef:
                name: squash-assistant-resa-squash
            - secretRef:
                name: squash-assistant-database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: squash-assistant-ui
  namespace: squash-assistant
spec:
  type: ClusterIP
  selector:
    app: squash-assistant-ui
  ports:
    - port: 3000
      targetPort: 3000
---
# Accès UI : LAN (http://squash-assistant.homelab) + public HTTPS
# (https://squash-assistant.code-advisors.site, Jalon C). Protection par Authentik
# (ForwardAuth Traefik) sur les deux hosts : Jalon B/C du plan
# k3s-homelab/docs/plan/plan-authentik-k3s-squash-assistant.md — accès réservé
# au groupe Authentik `homelab-admins`. Le Middleware `ak-outpost-squash-assistant`
# (namespace `authentik`) est auto-géré par l'Outpost Authentik dédié.
# Provider Authentik en mode forward_single, external_host = host public (Jalon C) :
# le cookie de session Authentik n'est valide que sur ce host — voir jalon-c-report.md
# (impact potentiel sur le flux LAN, forward_single ne supporte qu'un seul external_host).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squash-assistant-ui
  namespace: squash-assistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-squash-assistant@kubernetescrd
    # Cloudflare Full (strict) : certificat valide côté origine (pas seulement *.homelab)
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - squash-assistant.code-advisors.site
      secretName: squash-assistant-code-advisors-tls
  rules:
    - host: squash-assistant.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squash-assistant-ui
                port:
                  number: 3000
    - host: squash-assistant.code-advisors.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squash-assistant-ui
                port:
                  number: 3000
